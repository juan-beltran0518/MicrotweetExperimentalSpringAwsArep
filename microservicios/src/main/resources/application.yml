spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/microtweet
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect   
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_ho14x1DBa

server:
  port: 8080
