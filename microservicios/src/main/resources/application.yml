spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/microtweet
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect   
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://us-east-1ho14x1dba.auth.us-east-1.amazoncognito.com/oauth2/authorize?response_type=token%20id_token&client_id=2dppk4r2btjvjc0gj9n4ri1mu1&redirect_uri=http%3A%2F%2Flocalhost%3A5173%2Fcallback&scope=openid%20email&state=abc&nonce=xyz
server:
  port: 8080
